<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Test</title>
    <link rel="stylesheet" href="../CSS/AnimationTest.css">
</head>
<body>
    <main class="animation-stage" aria-live="polite">
        <div id="animation-container" class="animation-container">
            <img id="animated-element" class="animation-image" src="../Images/minecraft%20open%20gif.gif" alt="Minecraft chest opening">
            <div id="final-state" class="final-state" hidden>
                <img class="animation-image" src="../Images/hele%20zieke%20image.png" alt="Minecraft chest with a chatbox">
                <p id="chat-text" class="chat-text"></p>
            </div>
        </div>
    </main>
    <script src="../Javascript/AnimationTest.js"></script>
</body>
</html>
